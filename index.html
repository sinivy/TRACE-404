<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRACE//404</title>

    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <main class="terminal">

        <header class="cabecalho">
            <h1>TRACE<span>//</span>404</h1>
            <p>TERMINAL DE INVESTIGAÇÃO</p>
        </header>

        <section class="tela-terminal" id="tela-terminal">

            <div id="historico"></div>

            <div class="linha-comando">
                <span class="prefixo">investigador@trace:~$</span>

                <input
                    type="text"
                    id="campo-comando"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

        </section>

        <footer class="rodape">
            CONEXÃO CRIPTOGRAFADA // Produzido por SINIVY.
        </footer>

    </main>

    <script src="terminal.js"></script>

</body>
</html>
